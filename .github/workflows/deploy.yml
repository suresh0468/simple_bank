name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:

  deploy:
    name: Build Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Load secrets and save to app.env
        run: aws secretsmanager get-secret-value --secret-id simple_bank --query SecretString --output text | jq -r 'to_entries|map("\(.key)=\(.value)")|.[]' > app.env

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: simple-bank
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build Docker image with unique Git SHA tag
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

          # Push only the unique tag to ECR (bypasses immutability rule)
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update kube config
        run: aws eks update-kubeconfig --name simple-bank --region eu-north-1

      - name: Deploy image to Amazon EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: simple-bank
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # 1. Apply config files. (Note: deployment.yaml contains an old, hardcoded image hash)
          # We apply it anyway to ensure any changes to ports, replicas, etc., are updated .
          kubectl apply -f eks/aws-auth.yaml
          kubectl apply -f eks/deployment.yaml
          kubectl apply -f eks/service.yaml
          kubectl apply -f eks/ingress.yaml
          
          # 2. Immediately override the old hash from deployment.yaml with the brand new image tag  .
          # This safely bypasses the old hash and forces EKS to rollout the new code immediately.
          kubectl set image deployment/simple-bank-deployment simple-bank=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
